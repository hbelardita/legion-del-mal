name:  Reclutamiento de agente

on: push

jobs:
  reporte-reclutamiento:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: El agente se presenta
        run: echo "Hola, soy Horacio, tu agente de reclutamiento"
      - name: Reporte de identidad
        run: |
          echo "Reporte de identidad"
          echo "===================="
          echo ""
          echo "Nombre clave: ${{github.actor}}"
          echo "Identificador del job: ${{github.job}}"
          echo ""
          echo "Nombre del repo: ${{github.repository}}"
          echo "Commit: ${{github.sha}}"
      
      - name: Capcidades del agente
        run: |
          echo "Sistema operativo"
          uname -a
          echo ""
          echo "Info del CPU"
          lscpu | head
          echo ""
          echo "Memoria disponible"
          free -h | head -3
          echo "Version Node"
          node --version